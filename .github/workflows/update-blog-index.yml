name: Update Blog Index

on:
  push:
    branches:
      - main
    paths:
      - 'data/blogs/*.json'

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  rebuild-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate data/blogs/index.json
        run: |
          python3 - <<'EOF'
          import glob
          import json
          import os
          import re
          from urllib.parse import parse_qs, urlparse

          blogs_dir = 'data/blogs'
          index_path = os.path.join(blogs_dir, 'index.json')

          def normalize_blog_url(raw_url, slug):
              fallback = f'/blog/{slug}'
              if not raw_url:
                  return fallback

              parsed = urlparse(str(raw_url).strip())
              path = parsed.path or ''
              if not path and not parsed.scheme and not parsed.netloc:
                  path = str(raw_url).strip()

              if path.lower() == '/post.html':
                  query_slug = parse_qs(parsed.query).get('id', [slug])[0]
                  return f'/blog/{query_slug}'

              if not path:
                  return fallback
              if not path.startswith('/'):
                  path = '/' + path

              path = re.sub(r'/index\.html$', '/', path, flags=re.IGNORECASE)
              path = re.sub(r'\.html$', '', path, flags=re.IGNORECASE)
              path = path.rstrip('/')

              if not path or path == '/blog':
                  return fallback
              if not path.startswith('/blog/'):
                  return fallback
              return path

          posts = []
          for filepath in glob.glob(os.path.join(blogs_dir, '*.json')):
              slug = os.path.splitext(os.path.basename(filepath))[0]
              if slug == 'index':
                  continue
              try:
                  with open(filepath, encoding='utf-8') as f:
                      data = json.load(f)
                  normalized_url = normalize_blog_url(data.get('url'), slug)
                  if data.get('url') != normalized_url:
                      data['url'] = normalized_url
                      with open(filepath, 'w', encoding='utf-8') as f:
                          json.dump(data, f, indent=2, ensure_ascii=False)
                          f.write('\n')
                  date = data.get('date', '')
                  posts.append({'slug': slug, 'date': date})
              except Exception as e:
                  print(f'Warning: could not read {filepath}: {e}')

          # Sort newest-first (ISO date strings sort lexicographically)
          posts.sort(key=lambda p: p['date'], reverse=True)

          slugs = [p['slug'] for p in posts]
          with open(index_path, 'w', encoding='utf-8') as f:
              json.dump({'slugs': slugs}, f, indent=2, ensure_ascii=False)
              f.write('\n')

          print(f'Wrote {len(slugs)} slugs to {index_path}:')
          for s in slugs:
              print(f'  {s}')
          EOF

      - name: Create missing blog HTML pages
        run: python3 generate_blog_pages.py

      - name: Update sitemap.xml with new blog entries
        run: |
          python3 - <<'EOF'
          import glob
          import json
          import os
          import re

          blogs_dir = 'data/blogs'
          sitemap_path = 'sitemap.xml'
          site_url = 'https://metroguideindia.com'

          # Read current sitemap
          with open(sitemap_path, encoding='utf-8') as f:
              sitemap = f.read()

          added = 0
          for filepath in glob.glob(os.path.join(blogs_dir, '*.json')):
              slug = os.path.splitext(os.path.basename(filepath))[0]
              if slug == 'index':
                  continue
              try:
                  with open(filepath, encoding='utf-8') as f:
                      data = json.load(f)
              except Exception as e:
                  print(f'Warning: could not read {filepath}: {e}')
                  continue

              # Build the URL as it appears in the HTML file (percent-encode non-ASCII chars in slug)
              from urllib.parse import quote
              encoded_slug = quote(slug, safe='-._~')
              blog_url = f'{site_url}/blog/{encoded_slug}.html'

              # Check if this URL already appears in the sitemap (try both encoded and raw)
              raw_url = f'{site_url}/blog/{slug}.html'
              if blog_url in sitemap or raw_url in sitemap:
                  continue

              date = data.get('date', '2026-01-01')
              # Insert new entry before the closing </urlset> tag
              new_entry = (
                  f'  <url>\n'
                  f'    <loc>{blog_url}</loc>\n'
                  f'    <lastmod>{date}</lastmod>\n'
                  f'    <changefreq>monthly</changefreq>\n'
                  f'    <priority>0.8</priority>\n'
                  f'  </url>\n'
              )
              sitemap = sitemap.replace('</urlset>', new_entry + '</urlset>')
              print(f'Added to sitemap: {blog_url}')
              added += 1

          if added:
              with open(sitemap_path, 'w', encoding='utf-8') as f:
                  f.write(sitemap)
              print(f'Updated sitemap.xml with {added} new blog entry/entries.')
          else:
              print('No new blog entries to add to sitemap.')
          EOF

      - name: Commit updated index if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/blogs/*.json blog/*.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to commit — skipping."
          else
            git commit -m "chore: auto-update blog index, pages, and sitemap [skip ci]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
